# For the VPS only, and part of neither chart: a ClusterIssuer belongs to the cluster, not to Urumi.
# It tells cert-manager which certificate authority to ask. Staging gives test certificates
# (browsers warn) with generous limits; prod gives real ones, 5 a week for the same names.
# Both prove the domain over plain http (HTTP-01), answered through Traefik on port 80.
#   kubectl apply -f helm/cluster-issuers.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: you@example.com                 # yours: Let's Encrypt writes there about expiring certificates
    privateKeySecretRef:
      name: letsencrypt-staging-key        # cert-manager creates and keeps this account key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: you@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
