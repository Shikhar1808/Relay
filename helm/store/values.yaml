# One store, installed into the namespace store-<subdomain> (the platform finds its woo-mcp there).
# A second store is this chart installed again, with its own subdomain. Its Secret has the
# same name as its namespace, made with kubectl from a git-ignored env file before the install.
domain: 127.0.0.1.nip.io
scheme: http
tls:
  enabled: false
  clusterIssuer: letsencrypt-staging

store:
  subdomain: demo              # the storefront is <subdomain>.<domain>
  name: Demo Store
  adminUser: admin             # wp-admin's user; its password is WP_ADMIN_PASSWORD in the Secret
  adminEmail: admin@example.com
  timezone: Asia/Kolkata       # "today's orders" means the store's day; helm/platform's timezone must match
  currency: INR                # prices are shown in it; risk-mcp's limits assume it. Set when the store is first set up
  country: "IN:DL"             # the store's country:state; checkout starts on it. Set when the store is first set up

imagePullPolicy: IfNotPresent
images:
  wooMcp: relay-woo-mcp:0.1.0
  fulfilmentMcp: relay-fulfilment-mcp:0.1.0
  wordpress: wordpress:7.1-php8.3-apache
  wpCli: wordpress:cli-2.12-php8.3
  mysql: mysql:8.4

platformNamespace: urumi       # where the gateway and Postgres are
storageClass: local-path
mysqlStorage: 5Gi
wordpressStorage: 2Gi
# Two copies, so one can be killed in the demo while the other answers. Safe: the pods
# keep nothing, and the database settles two writes for the same order.
fulfilmentReplicas: 2

traefik:
  namespace: kube-system
  podLabels:
    app.kubernetes.io/name: traefik

# The script wp-init runs: --set-file scripts.wpInit=woo-mcp/deploy/wp-init.sh
scripts:
  wpInit: ""

quota:
  cpu: "1"
  memory: 2Gi
  memoryLimit: 4Gi
  storage: 10Gi

fulfilment:
  enabled: true
  # cpu: "1"
  # memory: 2Gi
  # memoryLimit: 4Gi
  # storage: 10Gi