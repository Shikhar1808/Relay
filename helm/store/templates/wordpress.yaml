# The storefront and wp-admin. A Deployment with a claim of its own (WordPress's files:
# themes, plugins, uploaded photos), which wp-init also mounts.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  annotations:
    # A claim made by the chart would be deleted by "helm uninstall", and the store's files
    # with it. "keep" leaves it: you delete it by hand when you mean it.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]   # one node at a time; on a one-node cluster wp-init can share it
  storageClassName: {{ .Values.storageClass }}
  resources:
    requests:
      storage: {{ .Values.wordpressStorage }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: { app: wordpress }
spec:
  selector: { app: wordpress }
  ports:
    - { name: http, port: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  # Recreate: stop the old pod before starting the new one. Two pods writing one
  # ReadWriteOnce disk during an update is what this prevents.
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: wordpress }
  template:
    metadata:
      labels: { app: wordpress }
    spec:
      automountServiceAccountToken: false   # the most exposed pod: give it nothing it does not need
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          env:
            - { name: WORDPRESS_DB_HOST, value: mysql }
            - { name: WORDPRESS_DB_NAME, value: wordpress }
            - { name: WORDPRESS_DB_USER, value: wordpress }
            - { name: WORDPRESS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: {{ .Release.Namespace }}, key: MYSQL_PASSWORD } } }
          ports:
            - { name: http, containerPort: 80 }
          # A fresh store redirects /wp-login.php to the installer: a 3xx counts as healthy.
          readinessProbe:
            httpGet: { path: /wp-login.php, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /wp-login.php, port: http }
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /var/www/html }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: wordpress-data }