# The storefront and wp-admin at <subdomain>.<domain>.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: storefront
  {{- if .Values.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-redirect-https@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.tls.enabled }}
  tls:
    - secretName: storefront-tls
      hosts:
        - {{ .Values.store.subdomain }}.{{ .Values.domain }}
  {{- end }}
  rules:
    - host: {{ .Values.store.subdomain }}.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: wordpress, port: { number: 80 } }
{{- if .Values.tls.enabled }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}