# A laptop: plain http, names under nip.io. nip.io is a public DNS service where
# anything.<address>.nip.io resolves to <address>, so it needs no setup.
# With k3d and the browser on the same machine, that is 127.0.0.1.nip.io. For a cluster on
# another machine, use its address: --set domain=192.168.1.20.nip.io (the same for helm/store).
domain: 127.0.0.1.nip.io
scheme: http
tls:
  enabled: false