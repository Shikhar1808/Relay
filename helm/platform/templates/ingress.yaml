# The three public names, all through Traefik. With tls.enabled, cert-manager sees the
# annotation, fetches one certificate for all three names into the Secret platform-tls,
# and the middleware below sends http:// visitors to https://.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform
  {{- if .Values.tls.enabled }}
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.tls.clusterIssuer }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-redirect-https@kubernetescrd
  {{- end }}
spec:
  ingressClassName: traefik
  {{- if .Values.tls.enabled }}
  tls:
    - secretName: platform-tls
      hosts:
        - app.{{ .Values.domain }}
        - api.{{ .Values.domain }}
        - mcp.{{ .Values.domain }}
  {{- end }}
  rules:
    - host: app.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: frontend, port: { number: 3000 } }
    - host: api.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: backend, port: { number: 8000 } }
    - host: mcp.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: gateway, port: { number: 8080 } }   # 8080 only: 9090 is never public
{{- if .Values.tls.enabled }}
---
# A Traefik object (not standard Kubernetes): answer http:// with a permanent redirect to https://.
# The annotation above names it as <namespace>-<name>@kubernetescrd.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}