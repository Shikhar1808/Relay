
{{- if .Values.monitoring.enabled }}
# Prometheus: scrapes the gateway and the backend every 15 s with the read-only token. No Ingress.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    scrape_configs:
      - job_name: gateway
        metrics_path: /metrics
        authorization: { credentials_file: /etc/prometheus/token/metrics-token }
        static_configs: [{ targets: ["gateway:9090"] }]
      - job_name: backend
        metrics_path: /internal/metrics
        authorization: { credentials_file: /etc/prometheus/token/metrics-token }
        static_configs: [{ targets: ["backend:8000"] }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass }}
  resources: { requests: { storage: {{ .Values.monitoring.storage }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
    - { name: web, port: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  strategy: { type: Recreate }       # a ReadWriteOnce volume cannot be shared by an old and a new pod
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534              # so it can write the volume
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: prometheus
          image: {{ .Values.images.prometheus }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ .Values.monitoring.retention }}
          ports:
            - { name: web, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: web }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /-/healthy, port: web }
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/prometheus.yml, subPath: prometheus.yml }
            - { name: token, mountPath: /etc/prometheus/token, readOnly: true }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus } }
        - name: token                 # only this one key of the Secret, as a file
          secret:
            secretName: {{ .Values.secretName }}
            items: [{ key: METRICS_TOKEN, path: metrics-token }]
        - { name: data, persistentVolumeClaim: { claimName: prometheus-data } }
{{- end }}