# Who may connect to whom, inside the namespace urumi. The first policy refuses every
# incoming connection to every pod here; each later one opens exactly one path.

# 1. Nothing gets in unless a rule below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}              # {} selects every pod in the namespace
  policyTypes: [Ingress]
---
# 2. The dashboard: from Traefik only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "relay.fromTraefik" . | nindent 8 }}
      ports:
        - { port: 3000, protocol: TCP }
---
# 3. The API: from Traefik (browsers), and from the gateway (whose token is this?).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
spec:
  podSelector:
    matchLabels: { app: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "relay.fromTraefik" . | nindent 8 }}
        - podSelector:
            matchLabels: { app: gateway }
        {{- if .Values.monitoring.enabled }}
        - podSelector:
            matchLabels: { app: prometheus }    # /internal/metrics, with its own read-only token
        {{- end }}
      ports:
        - { port: 8000, protocol: TCP }
---
# 4. The gateway: /mcp from Traefik and from the backend (the chat agent);
#    the private port 9090 from the backend only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway
spec:
  podSelector:
    matchLabels: { app: gateway }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "relay.fromTraefik" . | nindent 8 }}
      ports:
        - { port: 8080, protocol: TCP }
    - from:
        - podSelector:
            matchLabels: { app: backend }
      ports:
        - { port: 8080, protocol: TCP }
        - { port: 9090, protocol: TCP }
    - from:
        - podSelector:
            matchLabels: { app: store-worker }
      ports:
        - { port: 9090, protocol: TCP }    # the audit log, which records each server it adds or removes
    {{- if .Values.monitoring.enabled }}
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { port: 9090, protocol: TCP }    # /metrics, with its own read-only token
    {{- end }}
---
# 5. Postgres: from the three that use it here, and from fulfilment-mcp in any store's
#    namespace (a namespace marked urumi.io/store=true). That role can open only
#    its own database (db-init.sh), so this rule does not reach the platform's data.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [backend, gateway, db-init, store-worker] }
        - namespaceSelector:
            matchLabels: { urumi.io/store: "true" }
          podSelector:
            matchLabels: { app: fulfilment-mcp }
      ports:
        - { port: 5432, protocol: TCP }
---
# 6. Redis: from the backend and the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels: { app: redis }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [backend, gateway, store-worker] }
      ports:
        - { port: 6379, protocol: TCP }
---
# 7. The risk check server: from the gateway only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: risk-mcp
spec:
  podSelector:
    matchLabels: { app: risk-mcp }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: gateway }
      ports:
        - { port: 8000, protocol: TCP }
{{- if .Values.tls.enabled }}
---
# 8. With https only: cert-manager proves you own the domain by answering Let's Encrypt
#    from a short-lived "solver" pod in this namespace. Traefik must reach it on 8089,
#    or the certificate never arrives.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acme-solver
spec:
  podSelector:
    matchLabels: { acme.cert-manager.io/http01-solver: "true" }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "relay.fromTraefik" . | nindent 8 }}
      ports:
        - { port: 8089, protocol: TCP }
{{- end }}
{{- if .Values.monitoring.enabled }}
---
# 9. Prometheus: from Grafana only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
spec:
  podSelector:
    matchLabels: { app: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: grafana }
      ports:
        - { port: 9090, protocol: TCP }
---
# 10. Grafana, the only way to the metrics: from Traefik only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana
spec:
  podSelector:
    matchLabels: { app: grafana }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- include "relay.fromTraefik" . | nindent 8 }}
      ports:
        - { port: 3000, protocol: TCP }
{{- end }}
