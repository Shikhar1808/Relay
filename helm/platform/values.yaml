domain: 127.0.0.1.nip.io
scheme: http

tls: 
  enabled: false
  clusterIssuer: letsencrypt-staging

imagePullPolicy: IfNotPresent
images:
  backend: relay-backend:0.2.4
  gateway: relay-gateway:0.1.2
  frontend: relay-frontend:0.3.2
  riskMcp: relay-risk-mcp:0.1.0
  postgres: postgres:18-alpine
  redis: redis:7-alpine
  storeWorker: relay-store-worker:0.1.3
  prometheus: prom/prometheus:v3.5.0
  grafana: grafana/grafana:11.6.0

secretName: urumi-platform

storageClass: local-path
postgresStorage: 5Gi

podCidr: 10.42.0.0/16

traefik:
  namespace: kube-system
  podLabels:
    app.kubernetes.io/name: traefik

#plain settings
adminEmail: admin@example.com
smtpFrom: "Relay <onboarding@resend.dev>"
llmBaseUrl: https://api.groq.com/openai/v1
llmModel: openai/gpt-oss-20b
timezone: Asia/Kolkata         # the first store's day, for the chat: must match store.timezone in helm/store
auditDetail: standard

# The first store, installed with helm/store into the namespace store-<subdomain>.
firstStore:
  subdomain: demo
  name: Demo Store

scripts:
  dbInit: ""

maxStores: 5
storeWorker:
  valuesFile: values-local.yaml

monitoring:
  enabled: true
  retention: 3d
  storage: 3Gi