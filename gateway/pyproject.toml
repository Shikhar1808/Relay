[project]
name = "urumi-mcp-gateway"
version = "0.1.0"
description = "MCP gateway: one authenticated /mcp endpoint in front of the registered upstream MCP servers"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
    "asyncpg==0.30.0",
    "redis==5.2.1",
    "cryptography==46.0.3",
    "pydantic-settings==2.6.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
# `uv run pytest` from this directory. These tests need no running stack.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
