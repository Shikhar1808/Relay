services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-platform}
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-platform}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Encrypts upstream MCP server credentials; the gateway holds the same key.
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?set GATEWAY_ENCRYPTION_KEY in .env}
      # What the gateway must present to /internal/*.
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?set INTERNAL_SERVICE_TOKEN in .env}
      # The gateway's private port: registry changes are recorded in its audit log, and the dashboard reads it.
      GATEWAY_INTERNAL_URL: http://gateway:9090
      # Optional: set both to auto-create the admin on startup, or leave both
      # unset and use POST /auth/admin/signup instead (see IMPLEMENTATION.md).
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Email. Defaults are Resend's SMTP relay; SMTP_PASSWORD is the Resend
      # API key. Leave it unset and emails are logged instead of sent.
      SMTP_HOST: ${SMTP_HOST:-smtp.resend.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Urumi <onboarding@resend.dev>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      # The first store and its MCP server, registered on startup like any later store
      # (app/services/bootstrap.py). Its tools are named woo-<subdomain>__<tool>.
      FIRST_STORE_SUBDOMAIN: ${FIRST_STORE_SUBDOMAIN:-demo}
      FIRST_STORE_NAME: ${FIRST_STORE_NAME:-Demo Store}
      FIRST_STORE_URL: ${FIRST_STORE_URL:-http://localhost:8081}
      WOO_MCP_URL: http://woo-mcp:8000/mcp
      WOO_MCP_TOKEN: ${WOO_MCP_TOKEN:?set WOO_MCP_TOKEN in .env}
      # The chat agent's model, reached in the OpenAI chat format: Groq directly for now. Putting an
      # LLM gateway in front of several providers later means changing these three values, no code.
      # Without a key the chat says it is not set up and everything else works.
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_API_KEY: ${GROQ_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-20b}
      # "Today" for the agent is the store's day.
      STORE_TIMEZONE: ${WP_TIMEZONE:-Asia/Kolkata}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # One-shot: gives the gateway a database role that can only read the
  # upstream registry, creates the append-only audit log database (mcp_logs),
  # and fulfilment-mcp's database and role. Runs after the backend, whose
  # migrations create the registry table.
  db-init:
    image: postgres:18-alpine
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-platform}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-platform}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?set GATEWAY_DB_PASSWORD in .env}
      FULFILMENT_DB_PASSWORD: ${FULFILMENT_DB_PASSWORD:?set FULFILMENT_DB_PASSWORD in .env}
    volumes:
      - ./gateway/deploy/db-init.sh:/db-init.sh:ro
    entrypoint: ["sh", "/db-init.sh"]
    depends_on:
      backend:
        condition: service_healthy
    restart: "no"

  gateway:
    build: ./gateway
    environment:
      PLATFORM_DATABASE_URL: postgresql://gateway:${GATEWAY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-platform}
      LOGS_DATABASE_URL: postgresql://gateway:${GATEWAY_DB_PASSWORD}@postgres:5432/mcp_logs
      AUDIT_HMAC_KEY: ${AUDIT_HMAC_KEY:?set AUDIT_HMAC_KEY in .env}
      AUDIT_DETAIL: ${AUDIT_DETAIL:-standard}
      REDIS_URL: redis://redis:6379/0
      RESOLVE_URL: http://backend:8000/internal/auth/resolve
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY}
      # The gateway's address as MCP clients reach it, and the Host headers it answers to.
      PUBLIC_BASE_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:8080}
      AUTH_ISSUER_URL: ${API_URL:-http://localhost:8000}
    read_only: true
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"  # /mcp only; the private port (9090: health, audit log for the backend) is deliberately not published

  # ---- The first store: WordPress + WooCommerce on its own MySQL, and its MCP server ----
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Over TCP on purpose: while the image is still initialising, MySQL only listens on its socket.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:7.1-php8.3-apache
    environment: &wordpress-db
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/wp-login.php') === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "8081:80"  # the storefront and wp-admin

  # One-shot: installs WooCommerce and registers the MCP server's REST key. Safe to run again.
  wp-init:
    image: wordpress:cli-2.12-php8.3
    user: "33:33"  # www-data in the wordpress image; the cli image's own user cannot write that volume
    environment:
      <<: *wordpress-db
      WP_URL: ${FIRST_STORE_URL:-http://localhost:8081}
      WP_TITLE: ${FIRST_STORE_NAME:-Demo Store}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:?set WP_ADMIN_PASSWORD in .env}
      WP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      WP_TIMEZONE: ${WP_TIMEZONE:-Asia/Kolkata}
      WOOCOMMERCE_KEY: ${WOOCOMMERCE_KEY:?set WOOCOMMERCE_KEY in .env}
      WOOCOMMERCE_SECRET: ${WOOCOMMERCE_SECRET:?set WOOCOMMERCE_SECRET in .env}
    volumes:
      - wordpress_data:/var/www/html
      - ./woo-mcp/deploy/wp-init.sh:/wp-init.sh:ro
    entrypoint: ["sh", "/wp-init.sh"]
    depends_on:
      wordpress:
        condition: service_healthy
    restart: "no"

  woo-mcp:
    build: ./woo-mcp
    environment:
      WOOCOMMERCE_URL: http://wordpress
      WOOCOMMERCE_KEY: ${WOOCOMMERCE_KEY}
      WOOCOMMERCE_SECRET: ${WOOCOMMERCE_SECRET}
      # What the gateway must present; the backend stores the same value, encrypted, in the registry.
      MCP_AUTH_TOKEN: ${WOO_MCP_TOKEN}
    read_only: true
    depends_on:
      wp-init:
        condition: service_completed_successfully
    # No ports on purpose: only the gateway reaches this, over the compose network.

  # ---- Servers 2 and 3. Registered by hand as the admin (see each README) ----
  photos-mcp:
    build: ./photos-mcp
    environment:
      # Optional: without a key the server starts and its tool answers that it is not set up.
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      MCP_AUTH_TOKEN: ${PHOTOS_MCP_TOKEN:?set PHOTOS_MCP_TOKEN in .env}
    read_only: true
    # No ports on purpose: only the gateway reaches this.

  fulfilment-mcp:
    build: ./fulfilment-mcp
    environment:
      # Its own database and role, made by db-init: it cannot open the platform's.
      DATABASE_URL: postgresql://fulfilment:${FULFILMENT_DB_PASSWORD}@postgres:5432/fulfilment
      MCP_AUTH_TOKEN: ${FULFILMENT_MCP_TOKEN:?set FULFILMENT_MCP_TOKEN in .env}
      TIMEZONE: ${WP_TIMEZONE:-Asia/Kolkata}
    read_only: true
    depends_on:
      db-init:
        condition: service_completed_successfully
    # No ports on purpose: only the gateway reaches this.

  # Fake upstream MCP servers for gateway/tests/integration_test.py:
  #   docker compose --profile test up -d
  mock-upstream: &mock-upstream
    profiles: [test]
    build: ./gateway
    working_dir: /tests
    volumes:
      - ./gateway/tests:/tests:ro
    command: ["uvicorn", "mock_upstream:app", "--host", "0.0.0.0", "--port", "9000", "--log-level", "warning"]
    healthcheck:
      disable: true  # the image's check is for the gateway's own health port
  mock-hung:  # the same server, but its tools/list never answers
    <<: *mock-upstream
    environment:
      HANG: "1"
  mock-b:  # a second copy, for the test to kill and bring back
    <<: *mock-upstream

  frontend:
    build: ./frontend
    environment:
      # The backend's address as a BROWSER reaches it, not the in-network
      # name: pages call the API straight from the browser. Read at
      # runtime, so the same image works in every environment.
      API_URL: ${API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  mysql_data:
  wordpress_data:
