[project]
name = "urumi-platform-api"
version = "0.1.0"
description = "Platform API: auth, team management, gateway API keys, store stubs, chat token flow"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "bcrypt==5.0.0",
    "email-validator==2.2.0",
    "alembic==1.20.0",
    "cryptography==46.0.3",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# `uv run pytest` from this directory. These tests need no running stack,
# except the ones marked `live`, which skip themselves when it is not up.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["live: needs the compose stack (Redis on localhost:6379)"]
