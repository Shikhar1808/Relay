[project]
name = "relay-platform-api"
version = "0.1.0"
description = "Platform API: auth, team management, gateway API keys, store stubs, chat token flow"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",
    "pydantic==2.14.0",
    "pydantic-settings==2.6.1",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "bcrypt==5.0.0",
    "email-validator==2.2.0",
    "alembic==1.20.0",
    "cryptography==46.0.3",
    "langgraph==1.2.15",
    "langchain-openai==1.7.1",
    "langgraph-checkpoint-postgres==3.1.3",
    "mcp==2.3.0",
    "psycopg[binary,pool]==3.3.6",
    "langchain-core==1.6.10",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
# `uv run pytest` from this directory. These tests need no running stack,
# except the ones marked `live`, which skip themselves when it is not up.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["live: needs the compose stack (Redis on localhost:6379)"]
