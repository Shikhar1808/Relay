[project]
name = "urumi-platform-api"
version = "0.1.0"
description = "Platform API: auth, team management, gateway API keys, store stubs, chat token flow"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "sqlalchemy==2.0.36",
    "asyncpg==0.30.0",
    "greenlet==3.1.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "redis==5.2.1",
    "pyjwt==2.10.1",
    "bcrypt==5.0.0",
    "email-validator==2.2.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
]

[tool.uv]
package = false
